<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skate 3 Rust Engine</title>
<style>
  :root {
    --bg: #101114;
    --panel: #1a1c21;
    --text: #e8e9ec;
    --muted: #9a9ea8;
    --accent: #f2b33d;
    --error: #ff6b5e;
    --bar: #2b2e36;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #stage { position: fixed; inset: 0; }
  #skate-canvas { display: block; width: 100%; height: 100%; outline: none; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 16px; background: var(--bg); }
  #overlay[hidden] { display: none; }
  .card { width: min(520px, 100%); background: var(--panel); border-radius: 12px; padding: 28px; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  .sub { margin: 0 0 20px; color: var(--muted); }
  #status { margin: 0 0 10px; min-height: 1.5em; }
  .bar { height: 6px; border-radius: 3px; background: var(--bar); overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .15s; }
  button { margin-top: 20px; width: 100%; padding: 12px; border: 0; border-radius: 8px;
    background: var(--accent); color: #17130a; font: 600 16px system-ui, sans-serif; cursor: pointer; }
  button[hidden] { display: none; }
  .hint { margin: 14px 0 0; color: var(--muted); font-size: 13px; }
  #error { display: none; margin-top: 18px; }
  #error.shown { display: block; }
  #error pre { max-height: 220px; overflow: auto; margin: 0 0 8px; padding: 10px; border-radius: 8px;
    background: #0b0c0e; color: var(--error); white-space: pre-wrap; word-break: break-word; font-size: 12px; }
  #error button { margin-top: 0; padding: 8px; background: var(--bar); color: var(--text); font-weight: 500; }
  footer { margin-top: 18px; color: var(--muted); font-size: 12px; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<div id="stage"><canvas id="skate-canvas" tabindex="0"></canvas></div>
<div id="overlay">
  <div class="card">
    <h1>Skate 3 Rust Engine</h1>
    <p class="sub">Browser build · WebGPU</p>
    <p id="status">Checking your browser…</p>
    <div class="bar"><div id="progress"></div></div>
    <button id="start" hidden>Click to start</button>
    <p class="hint">Plug in a controller and press any button so the browser can see it. Escape opens settings.</p>
    <div id="error"><pre id="error-text"></pre><button id="copy">Copy error</button></div>
    <footer>GPL-3.0 · <a id="source" href="https://github.com/SK8-ENGINE/skate-3-rust-engine">source code</a><span id="revision"></span>.
      Not affiliated with Electronic Arts. Game data comes from the server operator's own disc.</footer>
  </div>
</div>
<script type="module" src="loader.js"></script>
</body>
</html>
