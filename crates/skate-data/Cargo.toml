[package]
name = "skate-data"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
skate-fs.workspace = true
web-time.workspace = true
flate2 = "=1.1.10"
skate-core = { path = "../skate-core" }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zstd = "=0.13.3"

# The C zstd library does not build for wasm32-unknown-unknown; maps only need decoding there.
[target.'cfg(target_arch = "wasm32")'.dependencies]
ruzstd = "=0.8.3"

[dev-dependencies]
zstd = "=0.13.3"
