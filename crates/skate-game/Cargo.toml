[package]
name = "skate-game"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "skate3rust"
path = "src/main.rs"

[[bin]]
name = "skate3-multiplayer"
path = "src/multiplayer_main.rs"
test = false

[[bin]]
name = "skate3-custom-models"
path = "src/custom_models_main.rs"
test = false

[features]
default = ["dev-dynamic"]
dev-dynamic = ["bevy/dynamic_linking"]

[dependencies]
skate-fs.workspace = true
web-time.workspace = true
bevy = { workspace = true, features = ["jpeg", "trace", "debug", "bevy_audio", "wav"] }
skate-core.workspace = true
skate-data.workspace = true
half = "=2.7.1"
serde_json.workspace = true
serde.workspace = true
    skate-net = { path = "../skate-net" }
blake3 = "=1.8.7"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
skate-mods = { path = "../skate-mods" }
skate-dynamics = { path = "../skate-dynamics" }
skate-audio = { path = "../skate-audio" }
gltf = { version = "=1.4.1", default-features = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# SDL3 gamepad input for every native platform, built from source and statically linked.
sdl3 = { version = "=0.20.0", features = ["build-from-source-static"] }

# Browser build: WebGPU rendering, the Gamepad API, and the JS bridge. Build with
# `--no-default-features` (no dynamic linking on wasm); see web/README-web.md.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { workspace = true, features = ["webgpu"] }
wasm-bindgen = "=0.2.127"
js-sys = "=0.3.104"
web-sys = { version = "=0.3.104", features = ["console", "KeyboardEvent", "EventTarget", "Window", "Navigator", "Gamepad", "GamepadButton", "GamepadMappingType", "Location", "UrlSearchParams", "Document", "Performance"] }
console_error_panic_hook = "=0.1.7"

[dev-dependencies]
naga = { version = "=27.0.3", features = ["wgsl-in"] }
naga_oil = { version = "=0.20.0", default-features = false }
wgpu = { version = "=27.0.1", default-features = false, features = ["vulkan", "naga-ir"] }
