[package]
name = "skate-fs"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "std::fs for native builds; a server-backed virtual filesystem for the browser build"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time.workspace = true
wasm-bindgen = "=0.2.127"
js-sys = "=0.3.104"
web-sys = { version = "=0.3.104", features = ["XmlHttpRequest", "Window", "Storage", "console"] }
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
