[package]
name = "skate-web-server"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Serves the browser build of the game and the operator's converted game data"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "compression-br", "compression-gzip", "set-header"] }
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
